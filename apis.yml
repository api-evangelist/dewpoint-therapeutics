name: Dewpoint Therapeutics
description: Dewpoint Therapeutics is a biotechnology company applying the emerging
  science of biomolecular condensates to drug discovery. Founded in 2018 and headquartered
  in Boston, Massachusetts, with an additional research site in Dresden, Germany, Dewpoint
  has built an AI-powered, end-to-end platform (ERSA, powered by ERSAi) spanning target
  discovery, condensate-modulating (c-mod) drug discovery, optimization, and development.
  Its pipeline targets previously undruggable diseases across oncology, neurodegeneration,
  cardiopulmonary, and virology, with collaborations including Bayer, Novo Nordisk,
  Evotec, and Chemify. Dewpoint is a General Catalyst portfolio company; it operates
  internal research platforms and the open CD-CODE condensate knowledge platform
  (condensates.com), but does not publish a public developer API.
